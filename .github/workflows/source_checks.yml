name: Source and documentation checks

on:
  push:
    branches: [main, rdna2nr]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check public links and excluded assets
        run: python3 tools/check_release_source.py
